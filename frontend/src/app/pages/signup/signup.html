<div class="bootstrap-wrapper">

<div class="container">
<div class="row">

    <div class="col-md-6 offset-md-3"> 
        <div class="container text-center">
           <img src="assets/examlogo.jpg" alt="Exam Logo" />
        </div>

        <h1 class="text-center"> Register Here!</h1>
        

       <form (ngSubmit)="formSubmit()">

  <mat-form-field class="full-width" appearance="outline">
    <mat-label>Username</mat-label>
    <input [(ngModel)]="user.username" 
    name="username"
    matInput placeholder="Enter username">
  </mat-form-field>

  <mat-form-field class="full-width" appearance="outline">
    <mat-label>Password</mat-label>
    <input [(ngModel)]="user.passsword"
    name="password"
    type="password" matInput placeholder="Enter password">
  </mat-form-field>

  <mat-form-field class="full-width" appearance="outline">
    <mat-label>First Name</mat-label>
    <input [(ngModel)]="user.firstName" 
    name="firstName"
    matInput placeholder="Enter first name">
  </mat-form-field>

  <mat-form-field class="full-width" appearance="outline">
    <mat-label>Last Name</mat-label>
    <input  [(ngModel)]="user.lastName" 
    name="lastName"
      matInput placeholder="Enter last name">
  </mat-form-field>

  <mat-form-field class="full-width" appearance="outline">
    <mat-label>Email</mat-label>
    <input type="email"  [(ngModel)]="user.email" 
    name="email"
     matInput placeholder="Enter email">
  </mat-form-field>

  <mat-form-field class="full-width" appearance="outline">
    <mat-label>Phone Number</mat-label>
    <input  [(ngModel)]="user.phone" 
    name="phone" type="tel" matInput placeholder="Enter phone number">
  </mat-form-field>

  <div class="container text-center">

    <button type="submit"matButton="elevated">Submit</button>
    
    <button  matButton="elevated" color="accent">Clear</button>
    
  </div>
 

</form>

    
</div>

</div>

</div>
